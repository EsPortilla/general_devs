<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Evento</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 500px;
      width: 100%;
      overflow: hidden;
      animation: slideUp 0.5s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 40px 30px;
      text-align: center;
    }

    .header h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .header p {
      opacity: 0.9;
      font-size: 16px;
    }

    .form-container {
      padding: 40px 30px;
    }

    .form-group {
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #333;
      font-size: 14px;
    }

    input[type="text"],
    input[type="email"] {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 16px;
      transition: all 0.3s ease;
    }

    input[type="text"]:focus,
    input[type="email"]:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .btn {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .message {
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      display: none;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .message.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
      display: block;
    }

    .message.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
      display: block;
    }

    .event-info {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 25px;
      border-left: 4px solid #667eea;
    }

    .event-info h3 {
      color: #667eea;
      margin-bottom: 10px;
      font-size: 18px;
    }

    .event-info p {
      color: #666;
      margin: 5px 0;
      font-size: 14px;
    }

    .footer {
      text-align: center;
      padding: 20px;
      background: #f8f9fa;
      color: #666;
      font-size: 14px;
    }

    .footer a {
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 600px) {
      .container {
        border-radius: 0;
      }

      .header {
        padding: 30px 20px;
      }

      .header h1 {
        font-size: 24px;
      }

      .form-container {
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🎉 Registro de Evento</h1>
      <p>Completa el formulario para registrarte</p>
    </div>

    <div class="form-container">
      <div id="eventInfo" class="event-info">
        <h3>Cargando información del evento...</h3>
      </div>

      <div id="message" class="message"></div>

      <form id="registrationForm">
        <div class="form-group">
          <label for="firstName">Nombre *</label>
          <input
            type="text"
            id="firstName"
            name="firstName"
            required
            placeholder="Tu nombre"
          />
        </div>

        <div class="form-group">
          <label for="lastName">Apellido *</label>
          <input
            type="text"
            id="lastName"
            name="lastName"
            required
            placeholder="Tu apellido"
          />
        </div>

        <div class="form-group">
          <label for="email">Correo Electrónico *</label>
          <input
            type="email"
            id="email"
            name="email"
            required
            placeholder="tu@email.com"
          />
        </div>

        <button type="submit" class="btn" id="submitBtn">
          Registrarme
        </button>
      </form>
    </div>

    <div class="footer">
      <a href="/admin">Acceso Administrador</a>
    </div>
  </div>

  <script>
    const API_URL = window.location.origin;

    // Load event information
    async function loadEventInfo() {
      try {
        const response = await fetch(`${API_URL}/health`);
        const data = await response.json();

        const eventDate = new Date(data.event.date);
        const eventInfoDiv = document.getElementById('eventInfo');

        eventInfoDiv.innerHTML = `
          <h3>${data.event.name}</h3>
          <p>📅 <strong>Fecha:</strong> ${eventDate.toLocaleDateString('es-ES', {
            weekday: 'long',
            year: 'numeric',
            month: 'long',
            day: 'numeric'
          })}</p>
          <p>🕒 <strong>Hora:</strong> ${eventDate.toLocaleTimeString('es-ES', {
            hour: '2-digit',
            minute: '2-digit'
          })}</p>
        `;
      } catch (error) {
        console.error('Error loading event info:', error);
      }
    }

    // Show message
    function showMessage(message, type) {
      const messageDiv = document.getElementById('message');
      messageDiv.textContent = message;
      messageDiv.className = `message ${type}`;
      messageDiv.style.display = 'block';

      // Scroll to message
      messageDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

      // Hide after 10 seconds for success messages
      if (type === 'success') {
        setTimeout(() => {
          messageDiv.style.display = 'none';
        }, 10000);
      }
    }

    // Handle form submission
    document.getElementById('registrationForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const submitBtn = document.getElementById('submitBtn');
      const form = e.target;

      // Get form data
      const formData = {
        firstName: form.firstName.value.trim(),
        lastName: form.lastName.value.trim(),
        email: form.email.value.trim().toLowerCase()
      };

      // Validate
      if (!formData.firstName || !formData.lastName || !formData.email) {
        showMessage('Por favor completa todos los campos', 'error');
        return;
      }

      // Disable button and show loading
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="loading"></span>';

      try {
        const response = await fetch(`${API_URL}/api/register`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(formData)
        });

        const data = await response.json();

        if (response.ok && data.success) {
          showMessage(
            '✅ ¡Registro exitoso! Revisa tu correo electrónico para obtener tu código QR y detalles del evento.',
            'success'
          );
          form.reset();
        } else {
          showMessage(
            `❌ Error: ${data.error || 'No se pudo completar el registro. Inténtalo nuevamente.'}`,
            'error'
          );
        }
      } catch (error) {
        console.error('Registration error:', error);
        showMessage(
          '❌ Error de conexión. Por favor verifica tu conexión a internet e inténtalo nuevamente.',
          'error'
        );
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Registrarme';
      }
    });

    // Load event info on page load
    loadEventInfo();
  </script>
</body>
</html>
