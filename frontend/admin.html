<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración - Evento</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #f5f7fa;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px;
      border-radius: 15px;
      margin-bottom: 30px;
      box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
    }

    .header h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .header p {
      opacity: 0.9;
    }

    .login-container {
      background: white;
      padding: 40px;
      border-radius: 15px;
      max-width: 400px;
      margin: 100px auto;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }

    .login-container h2 {
      margin-bottom: 20px;
      color: #333;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
      transition: transform 0.2s ease;
    }

    .stat-card:hover {
      transform: translateY(-5px);
    }

    .stat-card h3 {
      color: #666;
      font-size: 14px;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .stat-card .number {
      font-size: 36px;
      font-weight: bold;
      color: #667eea;
    }

    .actions {
      background: white;
      padding: 25px;
      border-radius: 15px;
      margin-bottom: 30px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
    }

    .actions h2 {
      margin-bottom: 15px;
      color: #333;
    }

    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-right: 10px;
      margin-bottom: 10px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    .btn-secondary {
      background: #48bb78;
      color: white;
    }

    .btn-secondary:hover {
      background: #38a169;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
    }

    .attendees-section {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
    }

    .attendees-section h2 {
      margin-bottom: 20px;
      color: #333;
    }

    .filters {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 8px 16px;
      border: 2px solid #e0e0e0;
      background: white;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 14px;
    }

    .filter-btn.active {
      background: #667eea;
      color: white;
      border-color: #667eea;
    }

    .search-box {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .search-box:focus {
      outline: none;
      border-color: #667eea;
    }

    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 800px;
    }

    thead {
      background: #f8f9fa;
    }

    th, td {
      padding: 15px;
      text-align: left;
      border-bottom: 1px solid #e0e0e0;
    }

    th {
      font-weight: 600;
      color: #666;
      font-size: 12px;
      text-transform: uppercase;
    }

    tbody tr:hover {
      background: #f8f9fa;
    }

    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }

    .status-registered {
      background: #bee3f8;
      color: #2c5282;
    }

    .status-confirmed {
      background: #c6f6d5;
      color: #22543d;
    }

    .status-cancelled {
      background: #fed7d7;
      color: #742a2a;
    }

    .message {
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      display: none;
    }

    .message.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
      display: block;
    }

    .message.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
      display: block;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #666;
    }

    .loading-spinner {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .export-btn {
      float: right;
    }

    @media (max-width: 768px) {
      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .filters {
        flex-direction: column;
      }

      .filter-btn {
        width: 100%;
      }
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #333;
    }

    input[type="password"] {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 16px;
    }

    input[type="password"]:focus {
      outline: none;
      border-color: #667eea;
    }

    .back-link {
      display: inline-block;
      margin-top: 20px;
      color: #667eea;
      text-decoration: none;
    }

    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <!-- Login Form -->
  <div id="loginContainer" class="login-container">
    <h2>🔐 Acceso Administrador</h2>
    <div id="loginMessage" class="message"></div>
    <form id="loginForm">
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" required autofocus />
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%;">
        Ingresar
      </button>
    </form>
    <a href="/" class="back-link">← Volver al registro</a>
  </div>

  <!-- Admin Dashboard -->
  <div id="dashboard" style="display: none;">
    <div class="container">
      <div class="header">
        <h1>📊 Panel de Administración</h1>
        <p>Gestiona los asistentes registrados para el evento</p>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <h3>Total Registrados</h3>
          <div class="number" id="totalCount">-</div>
        </div>
        <div class="stat-card">
          <h3>Pendientes</h3>
          <div class="number" id="registeredCount">-</div>
        </div>
        <div class="stat-card">
          <h3>Confirmados</h3>
          <div class="number" id="confirmedCount">-</div>
        </div>
        <div class="stat-card">
          <h3>Cancelados</h3>
          <div class="number" id="cancelledCount">-</div>
        </div>
      </div>

      <div class="actions">
        <h2>Acciones</h2>
        <div id="actionMessage" class="message"></div>
        <button class="btn btn-primary" onclick="loadAttendees()">
          🔄 Actualizar Datos
        </button>
        <button class="btn btn-secondary" onclick="sendReminders()" id="reminderBtn">
          📧 Enviar Recordatorios Manualmente
        </button>
        <button class="btn btn-primary export-btn" onclick="exportToCSV()">
          📥 Exportar CSV
        </button>
      </div>

      <div class="attendees-section">
        <h2>Lista de Asistentes</h2>

        <input
          type="text"
          class="search-box"
          id="searchBox"
          placeholder="Buscar por nombre o email..."
          onkeyup="filterAttendees()"
        />

        <div class="filters">
          <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">
            Todos
          </button>
          <button class="filter-btn" data-filter="registered" onclick="setFilter('registered')">
            Pendientes
          </button>
          <button class="filter-btn" data-filter="confirmed" onclick="setFilter('confirmed')">
            Confirmados
          </button>
          <button class="filter-btn" data-filter="cancelled" onclick="setFilter('cancelled')">
            Cancelados
          </button>
        </div>

        <div id="attendeesTable">
          <div class="loading">
            <div class="loading-spinner"></div>
            <p>Cargando asistentes...</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = window.location.origin;
    let adminPassword = '';
    let allAttendees = [];
    let currentFilter = 'all';

    // Handle login
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('password').value;
      adminPassword = password;

      try {
        const response = await fetch(`${API_URL}/api/attendees?password=${encodeURIComponent(password)}`);

        if (response.ok) {
          document.getElementById('loginContainer').style.display = 'none';
          document.getElementById('dashboard').style.display = 'block';
          loadAttendees();
        } else {
          showLoginMessage('Contraseña incorrecta', 'error');
        }
      } catch (error) {
        showLoginMessage('Error de conexión', 'error');
      }
    });

    function showLoginMessage(message, type) {
      const messageDiv = document.getElementById('loginMessage');
      messageDiv.textContent = message;
      messageDiv.className = `message ${type}`;
      messageDiv.style.display = 'block';
    }

    function showActionMessage(message, type) {
      const messageDiv = document.getElementById('actionMessage');
      messageDiv.textContent = message;
      messageDiv.className = `message ${type}`;
      messageDiv.style.display = 'block';
      setTimeout(() => {
        messageDiv.style.display = 'none';
      }, 5000);
    }

    async function loadAttendees() {
      try {
        const response = await fetch(`${API_URL}/api/attendees?password=${encodeURIComponent(adminPassword)}`);
        const data = await response.json();

        if (data.success) {
          allAttendees = data.attendees;
          updateStatistics(data.statistics);
          renderAttendees();
        }
      } catch (error) {
        console.error('Error loading attendees:', error);
        showActionMessage('Error al cargar los datos', 'error');
      }
    }

    function updateStatistics(stats) {
      document.getElementById('totalCount').textContent = stats.total || 0;
      document.getElementById('registeredCount').textContent = stats.registered || 0;
      document.getElementById('confirmedCount').textContent = stats.confirmed || 0;
      document.getElementById('cancelledCount').textContent = stats.cancelled || 0;
    }

    function renderAttendees() {
      const tableContainer = document.getElementById('attendeesTable');
      const searchTerm = document.getElementById('searchBox').value.toLowerCase();

      let filteredAttendees = allAttendees.filter(a => {
        const matchesFilter = currentFilter === 'all' || a.status === currentFilter;
        const matchesSearch = searchTerm === '' ||
          a.firstName.toLowerCase().includes(searchTerm) ||
          a.lastName.toLowerCase().includes(searchTerm) ||
          a.email.toLowerCase().includes(searchTerm);

        return matchesFilter && matchesSearch;
      });

      if (filteredAttendees.length === 0) {
        tableContainer.innerHTML = '<p style="text-align: center; padding: 40px; color: #666;">No se encontraron asistentes</p>';
        return;
      }

      const tableHTML = `
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Email</th>
                <th>Estado</th>
                <th>Fecha Registro</th>
                <th>Última Acción</th>
                <th>Recordatorio</th>
              </tr>
            </thead>
            <tbody>
              ${filteredAttendees.map(a => `
                <tr>
                  <td>#${String(a.id).padStart(4, '0')}</td>
                  <td>${a.firstName} ${a.lastName}</td>
                  <td>${a.email}</td>
                  <td>
                    <span class="status-badge status-${a.status}">
                      ${getStatusText(a.status)}
                    </span>
                  </td>
                  <td>${formatDate(a.registrationDate)}</td>
                  <td>${formatDate(a.confirmedAt || a.cancelledAt || a.registrationDate)}</td>
                  <td>${a.reminderSent ? '✅ Enviado' : '⏳ Pendiente'}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;

      tableContainer.innerHTML = tableHTML;
    }

    function getStatusText(status) {
      const statusMap = {
        registered: 'Pendiente',
        confirmed: 'Confirmado',
        cancelled: 'Cancelado'
      };
      return statusMap[status] || status;
    }

    function formatDate(dateString) {
      if (!dateString) return '-';
      const date = new Date(dateString);
      return date.toLocaleDateString('es-ES', {
        year: 'numeric',
        month: 'short',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    function setFilter(filter) {
      currentFilter = filter;

      // Update active button
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.remove('active');
        if (btn.dataset.filter === filter) {
          btn.classList.add('active');
        }
      });

      renderAttendees();
    }

    function filterAttendees() {
      renderAttendees();
    }

    async function sendReminders() {
      if (!confirm('¿Estás seguro de que quieres enviar recordatorios a todos los asistentes registrados?')) {
        return;
      }

      const btn = document.getElementById('reminderBtn');
      btn.disabled = true;
      btn.textContent = 'Enviando...';

      try {
        const response = await fetch(`${API_URL}/api/send-reminders`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Admin-Password': adminPassword
          }
        });

        const data = await response.json();

        if (data.success) {
          showActionMessage(`✅ Recordatorios enviados: ${data.sent} exitosos, ${data.errors || 0} errores`, 'success');
          loadAttendees();
        } else {
          showActionMessage(`❌ Error: ${data.message || data.error}`, 'error');
        }
      } catch (error) {
        showActionMessage('❌ Error al enviar recordatorios', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = '📧 Enviar Recordatorios Manualmente';
      }
    }

    function exportToCSV() {
      const csvContent = [
        ['ID', 'Nombre', 'Apellido', 'Email', 'Estado', 'Fecha Registro', 'Confirmado', 'Cancelado', 'Recordatorio Enviado'].join(','),
        ...allAttendees.map(a => [
          a.id,
          a.firstName,
          a.lastName,
          a.email,
          a.status,
          a.registrationDate,
          a.confirmedAt || '',
          a.cancelledAt || '',
          a.reminderSent ? 'Sí' : 'No'
        ].join(','))
      ].join('\n');

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      const url = URL.createObjectURL(blob);

      link.setAttribute('href', url);
      link.setAttribute('download', `asistentes_${new Date().toISOString().split('T')[0]}.csv`);
      link.style.visibility = 'hidden';

      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);

      showActionMessage('✅ CSV exportado correctamente', 'success');
    }
  </script>
</body>
</html>
